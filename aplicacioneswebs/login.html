<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Tech Wise</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: linear-gradient(135deg, #007BFF, #00d4ff);
    }
    .login-container {
      background: var(--white);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 350px;
      margin: 0 auto;
    }
    .login-container img {
      width: 100px;
      display: block;
      margin: 0 auto 20px;
    }
    .login-container h2 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .form-group button {
      width: 100%;
    }
    .error {
      color: var(--danger);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="content" style="display:flex;align-items:center;justify-content:center;">
    <div class="login-container">
      <img src="logo-techwise.png" alt="Tech Wise">

      <div id="login">
        <h2>Iniciar sesión</h2>
        <form onsubmit="login(event)">
          <div class="form-group">
            <input type="text" id="user" placeholder="Usuario" required>
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="Contraseña" required>
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
        <div style="display:flex;gap:10px;">
<button class="btn btn-secondary" onclick="mostrarRegistro()">Registro</button>
        <a href="index.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;padding:12px;margin-top:10px;">Volver</a>
        <button class="btn btn-danger" id="logoutBtn" onclick="cerrarSesion()" style="display:none">Cerrar sesión</button>
        </div>
        <div id="errorLogin" class="error"></div>
      </div>

      <div id="registro" style="display:none">
        <h2>Registro</h2>
        <form onsubmit="registrar(event)">
          <div class="form-group">
            <input type="text" id="newUser" placeholder="Nuevo usuario" required>
          </div>
          <div class="form-group">
            <input type="password" id="newPass" placeholder="Nueva contraseña" required>
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
        <button class="btn btn-secondary" onclick="mostrarLogin()">Volver</button>
        <a href="index.html" style="display:block;margin-top:10px;padding:10px;background:#007BFF;color:white;text-decoration:none;border-radius:6px;text-align:center;">Volver al inicio</a>
        <div id="errorRegistro" class="error"></div>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem("usuario")) {
      localStorage.setItem("usuario", "admin");
      localStorage.setItem("password", "1234");
    }

    // Verificar si ya está logueado
    if (localStorage.getItem("logueado") === "true") {
      mostrarCerrarSesion();
    }

    function login(e) {
      e.preventDefault();
      const user = document.getElementById("user").value;
      const pass = document.getElementById("password").value;

      if (user === localStorage.getItem("usuario") && pass === localStorage.getItem("password")) {
        localStorage.setItem("logueado", "true");
        window.location.href = "index.html";
      } else {
        document.getElementById("errorLogin").textContent = "Usuario o contraseña incorrectos";
      }
    }

    function mostrarRegistro() {
      document.getElementById("login").style.display = "none";
      document.getElementById("registro").style.display = "block";
    }

    function mostrarLogin() {
      document.getElementById("registro").style.display = "none";
      document.getElementById("login").style.display = "block";
    }

    function registrar(e) {
      e.preventDefault();
      const newUser = document.getElementById("newUser").value;
      const newPass = document.getElementById("newPass").value;

      localStorage.setItem("usuario", newUser);
      localStorage.setItem("password", newPass);
      localStorage.setItem("logueado", "true");
      document.getElementById("errorRegistro").textContent = "Registrado correctamente";
      setTimeout(() => window.location.href = "index.html", 1500);
    }

    function cerrarSesion() {
      localStorage.removeItem("logueado");
      window.location.href = "index.html";
    }

    function mostrarCerrarSesion() {
      document.getElementById("user").style.display = "none";
      document.getElementById("password").style.display = "none";
      document.querySelector("form button").style.display = "none";
      document.getElementById("errorLogin").innerHTML = "<strong>Ya estás conectado</strong>";
      document.getElementById("logoutBtn").style.display = "block";
    }
  </script>
</body>

</html>
