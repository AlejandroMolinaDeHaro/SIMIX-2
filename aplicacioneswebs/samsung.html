<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung - Tech Wise</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="top-bar">
    <div class="logo">
      <img src="logo-techwise.png" alt="Logo Tech Wise">
      <span>Samsung</span>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="carro.html">Carro <span id="contador" class="cart-count">0</span></a>
      <a href="Comparacióndemóviles.html">Comparar</a>
      <a href="admin.html">Admin</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="#" id="cerrarSesion" onclick="cerrarSesion(event)" style="display:none;color:#ffeb3b;">Cerrar sesión</a>
    </nav>
  </div>

  <div class="content">
    <h1 class="page-title">Samsung Galaxy</h1>
    
    <div class="featured" style="text-align:center;margin-bottom:30px;padding:20px;background:white;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);">
      <h2 style="color:var(--primary);margin-bottom:15px;">Último Lanzamiento</h2>
      <img src="samsugultra24.png" alt="Galaxy S24 Ultra" style="width:200px;">
      <h3 style="color:var(--primary);margin:15px 0;">Galaxy S24 Ultra</h3>
      <div class="price" style="font-weight:bold;font-size:24px;margin-bottom:15px;">1399 €</div>
      <button class="btn btn-primary" onclick="add('Samsung Galaxy S24 Ultra', 1399)">Añadir</button>
    </div>
    
    <div class="grid" id="samsungGrid"></div>
  </div>

  <div class="bottom-bar">
    <div>Tech Wise</div>
    <div class="center-address">Calle Corcega 31</div>
    <div>Tel: 634 578 952</div>
  </div>

  <script>
    const moviles = JSON.parse(localStorage.getItem("moviles")) || [];
    
    const samsungDefault = [
      { modelo: "Galaxy S25 Ultra", precio: 1319, imagen: "samsugultra24.png", fecha: "2025-01-22" },
      { modelo: "Galaxy S25+", precio: 999, imagen: "samsug23.png", fecha: "2025-01-22" },
      { modelo: "Galaxy S25", precio: 849, imagen: "samsung22.png", fecha: "2025-01-22" },
      { modelo: "Galaxy S24 Ultra", precio: 1119, imagen: "samsugultra24.png", fecha: "2024-01-17" },
      { modelo: "Galaxy S24", precio: 799, imagen: "samsug23.png", fecha: "2024-01-17" },
      { modelo: "Galaxy S23 Ultra", precio: 999, imagen: "samsugultra24.png", fecha: "2023-02-01" },
      { modelo: "Galaxy S23", precio: 749, imagen: "samsug23.png", fecha: "2023-02-01" },
      { modelo: "Galaxy A56", precio: 449, imagen: "samsugA54.png", fecha: "2025-03-02" },
      { modelo: "Galaxy A36", precio: 329, imagen: "samsugA54.png", fecha: "2025-03-02" },
      { modelo: "Galaxy A16", precio: 229, imagen: "samsugA54.png", fecha: "2025-03-02" },
      { modelo: "Galaxy Z Fold 6", precio: 1699, imagen: "galaxyzfold4.png", fecha: "2024-07-24" },
      { modelo: "Galaxy Z Flip 6", precio: 949, imagen: "galaxyzflip4.png", fecha: "2024-07-24" }
    ];

    const samsungGuardados = moviles.filter(m => m.marca === "samsung");
    const samsungTodos = [...samsungGuardados, ...samsungDefault];

    function getDescuento(fechaStr) {
      const fecha = new Date(fechaStr);
      const ahora = new Date();
      const diffMeses = (ahora - fecha) / (1000 * 60 * 60 * 24 * 30);
      return Math.min(Math.floor(diffMeses / 4) * 10, 10);
    }

    function mostrarSamsung() {
      const container = document.getElementById("samsungGrid");
      container.innerHTML = samsungTodos.map(m => {
        const descuento = m.fecha ? getDescuento(m.fecha) : 0;
        const precioFinal = descuento > 0 ? Math.round(m.precio * (1 - descuento / 100)) : m.precio;
        return `
        <div class="card">
          <img src="${m.imagen}" alt="${m.modelo}">
          <h3>${m.modelo}</h3>
          ${descuento > 0 ? `<div class="price" style="text-decoration:line-through;color:#999;">${m.precio} €</div>` : ''}
          <div class="price">${precioFinal} €${descuento > 0 ? ` <span style="color:var(--danger);font-size:14px;">(-${descuento}%)</span>` : ''}</div>
          <div class="buttons">
            <button class="btn btn-primary" onclick="add('${m.modelo}', ${precioFinal})">Añadir</button>
            <button class="btn btn-secondary" onclick="comparar('${m.modelo}', '${m.imagen}')">Comparar</button>
          </div>
        </div>
      `}).join("");
      
      document.getElementById("contador").textContent = (JSON.parse(localStorage.getItem("carrito")) || []).length;
    }

    function add(nombre, precio) {
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.push({ nombre, precio });
      localStorage.setItem("carrito", JSON.stringify(carrito));
      document.getElementById("contador").textContent = carrito.length;
      alert("Añadido: " + nombre);
    }

    function comparar(nombre, imagen) {
      const comp = JSON.parse(localStorage.getItem("comparar")) || [];
      if (comp.length >= 3) { alert("Máximo 3 móviles para comparar"); return; }
      if (!comp.find(x => x.nombre === nombre)) {
        comp.push({ nombre, imagen });
        localStorage.setItem("comparar", JSON.stringify(comp));
        alert("Añadido a comparar: " + nombre);
      } else {
        alert("Ya está en la comparación");
      }
    }

    mostrarSamsung();

    if (localStorage.getItem("logueado") === "true") {
      document.getElementById("cerrarSesion").style.display = "inline";
      document.getElementById("loginLink").style.display = "none";
    }

    function cerrarSesion(e) {
      e.preventDefault();
      localStorage.removeItem("logueado");
      window.location.href = "login.html";
    }
  </script>
</body>

</html>
