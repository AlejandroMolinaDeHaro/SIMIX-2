<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparador - Tech Wise</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .comparison-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .compare-card {
      background: var(--white);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 280px;
      display: flex;
      flex-direction: column;
    }

    .compare-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .stat-group {
      margin: 10px 0;
      text-align: left;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
    }

    .stat-group strong {
      color: var(--primary);
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .stat-group span {
      color: #333;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      font-size: 18px;
      color: #666;
      padding: 50px;
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="logo">
      <img src="logo-techwise.png" alt="Logo Tech Wise">
      <span>Comparador</span>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="carro.html">Carro <span id="contador" class="cart-count">0</span></a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>

  <div class="content">
    <h1 class="page-title">Comparador de Móviles</h1>
    <p style="text-align:center;color:#666;margin-bottom:20px;">Selecciona hasta 3 móviles para comparar</p>
    
    <div class="comparison-container" id="comparison-container"></div>
  </div>

  <div class="bottom-bar">
    <div>Tech Wise</div>
    <div class="center-address">Calle Corcega 31</div>
    <div>Tel: 634 578 952</div>
  </div>

  <script>
    const bbddStats = {
      "iPhone 15 Pro Max": { bateria: "Dura 1 día y medio", camara: "Excelente para fotos", pantalla: "Muy grande y viva", valor: "Premium (1499€)" },
      "iPhone 15 Pro": { bateria: "Dura 1 día", camara: "Muy buena", pantalla: "Excelente", valor: "Alto (1299€)" },
      "iPhone 15": { bateria: "Dura 1 día", camara: "Muy buenas fotos", pantalla: "Ideal", valor: "Alto (999€)" },
      "iPhone 14 Pro Max": { bateria: "1 día", camara: "Buena", pantalla: "Grande", valor: "Alto (1299€)" },
      "iPhone 14": { bateria: "1 día", camara: "Buena", pantalla: "Buena", valor: "Medio (899€)" },
      "iPhone SE": { bateria: "1 día", camara: "Normal", pantalla: "Pequeña", valor: "Económico (429€)" },

      "Galaxy S24 Ultra": { bateria: "Hasta 2 días", camara: "Mejor zoom", pantalla: "Inmensa", valor: "Premium (1399€)" },
      "Galaxy S24+": { bateria: "1 día", camara: "Muy buena", pantalla: "Grande", valor: "Alto (1199€)" },
      "Galaxy S24": { bateria: "1 día", camara: "Muy buena", pantalla: "Buena", valor: "Alto (899€)" },
      "Galaxy S23": { bateria: "1 día", camara: "Muy buena", pantalla: "Viva", valor: "Alto (899€)" },
      "Galaxy S22": { bateria: "Día", camara: "Buena", pantalla: "Buena", valor: "Medio (749€)" },
      "Galaxy A55": { bateria: "1 día", camara: "Normal", pantalla: "Buena", valor: "Económico (449€)" },
      "Galaxy A35": { bateria: "1 día", camara: "Normal", pantalla: "Buena", valor: "Económico (349€)" },
      "Galaxy Z Fold": { bateria: "1 día", camara: "Muy buena", pantalla: "Tablet", valor: "Ultra Premium" },
      "Galaxy Z Flip": { bateria: "Día", camara: "Buena", pantalla: "Plegable", valor: "Premium" },

      "Xiaomi 14 Ultra": { bateria: "1 día y medio", camara: "Increíble", pantalla: "Brillante", valor: "Premium (1499€)" },
      "Xiaomi 14": { bateria: "1 día", camara: "Muy buena", pantalla: "Brillante", valor: "Alto (999€)" },
      "Xiaomi 13": { bateria: "1 día", camara: "Muy buena", pantalla: "Genial", valor: "Alto (799€)" },
      "Redmi Note 13 Pro": { bateria: "2 días", camara: "Buena", pantalla: "Buena", valor: "Económico (399€)" },
      "Redmi Note 13": { bateria: "2 días", camara: "Normal", pantalla: "Buena", valor: "Económico (299€)" },
      "Poco X6 Pro": { bateria: "1 día", camara: "Regular", pantalla: "Buena", valor: "Medio (399€)" },
      "Poco F5": { bateria: "Día", camara: "Regular", pantalla: "Rápida", valor: "Medio (349€)" },

      "Pura 70": { bateria: "1 día", camara: "Buena", pantalla: "Buena", valor: "Alto" },
      "Mate 60 Pro": { bateria: "1 día", camara: "Muy buena", pantalla: "Grande", valor: "Premium" },
      "P50": { bateria: "1 día", camara: "Buena", pantalla: "Buena", valor: "Medio" },

      "Pixel 9 Pro": { bateria: "1 día", camara: "Excelente IA", pantalla: "Excelente", valor: "Premium (999€)" },
      "Pixel 8": { bateria: "1 día", camara: "Buena IA", pantalla: "Buena", valor: "Medio (699€)" },
      "Pixel 7a": { bateria: "1 día", camara: "Buena", pantalla: "Buena", valor: "Económico (499€)" },

      "Edge 50 Ultra": { bateria: "1 día", camara: "Muy buena", pantalla: "Curva", valor: "Premium (1199€)" },
      "Edge 50 Pro": { bateria: "1 día", camara: "Buena", pantalla: "Buena", valor: "Alto (899€)" },
      "G84": { bateria: "2 días", camara: "Normal", pantalla: "Buena", valor: "Económico (299€)" },
      "Razr 40": { bateria: "1 día", camara: "Buena", pantalla: "Plegable", valor: "Premium" },

      "Find X8 Pro": { bateria: "1 día", camara: "Excelente", pantalla: "Brillante", valor: "Premium (1199€)" },
      "Find X7": { bateria: "1 día", camara: "Muy buena", pantalla: "Buena", valor: "Alto" },
      "Reno12": { bateria: "1 día", camara: "Buena", pantalla: "Buena", valor: "Medio" },

      "Genérico": { bateria: "1 día", camara: "Estándar", pantalla: "Normal", valor: "Variable" }
    };

    function getStats(name) {
      if (bbddStats[name]) return bbddStats[name];
      for (let key in bbddStats) {
        if (name.toLowerCase().includes(key.toLowerCase())) {
          return bbddStats[key];
        }
      }
      return bbddStats["Genérico"];
    }

    function renderComparison() {
      const comp = JSON.parse(localStorage.getItem("comparar")) || [];
      const container = document.getElementById("comparison-container");
      container.innerHTML = "";

      if (comp.length === 0) {
        container.innerHTML = "<div class='empty-state'>No has seleccionado móviles para comparar.<br>Ve a las marcas y elige hasta 3.</div>";
        return;
      }

      comp.forEach((item, index) => {
        const stats = getStats(item.nombre);
        const card = document.createElement("div");
        card.className = "compare-card";
        card.innerHTML = `
          <img src="${item.img || 'descarga.png'}" alt="${item.nombre}">
          <h3 style="color:var(--primary);margin-bottom:15px;">${item.nombre}</h3>
          <div class="stat-group"><strong>Batería</strong><span>${stats.bateria}</span></div>
          <div class="stat-group"><strong>Cámara</strong><span>${stats.camara}</span></div>
          <div class="stat-group"><strong>Pantalla</strong><span>${stats.pantalla}</span></div>
          <div class="stat-group"><strong>Precio</strong><span>${stats.valor}</span></div>
          <button class="btn btn-danger" onclick="removeCompare(${index})" style="margin-top:15px">Quitar</button>
        `;
        container.appendChild(card);
      });
    }

    function removeCompare(index) {
      const comp = JSON.parse(localStorage.getItem("comparar")) || [];
      comp.splice(index, 1);
      localStorage.setItem("comparar", JSON.stringify(comp));
      renderComparison();
    }

    document.getElementById("contador").textContent = (JSON.parse(localStorage.getItem("carrito")) || []).length;
    renderComparison();
  </script>
</body>

</html>
