<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Wise - Móviles</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="top-bar">
    <div class="logo">
      <img src="logo-techwise.png" alt="Logo Tech Wise">
      <span>Tech Wise</span>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="carro.html">Carro <span id="contador" class="cart-count">0</span></a>
      <a href="Comparacióndemóviles.html">Comparar</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>

  <div class="content">
    <h1 class="page-title">Móviles Tech Wise</h1>
    
    <div class="grid" id="techwiseGrid"></div>
  </div>

  <div class="bottom-bar">
    <div>Tech Wise</div>
    <div class="center-address">Calle Corcega 31</div>
    <div>Tel: 634 578 952</div>
  </div>

  <script>
    const moviles = JSON.parse(localStorage.getItem("moviles")) || [];
    
    const techwiseDefault = [
      { modelo: "Tech Wise Phone 1", precio: 499, imagen: "TechWisePhone1.png" },
      { modelo: "Tech Wise Phone 2", precio: 599, imagen: "TechWisePhone2.png" },
      { modelo: "Tech Wise Phone Pro", precio: 749, imagen: "TechWisePhonePro.png" },
      { modelo: "Tech Wise Phone Lite", precio: 299, imagen: "TechWisePhoneLite.png" },
      { modelo: "Tech Wise Phone 3", precio: 399, imagen: "TechWisePhone3.png" },
      { modelo: "Tech Wise Phone 3 Pro", precio: 499, imagen: "TechWisePhone3Pro.png" },
      { modelo: "Tech Wise Phone 4", precio: 599, imagen: "TechWisePhone4.png" },
      { modelo: "Tech Wise Phone 4 Max", precio: 699, imagen: "TechWisePhone4Max.png" },
      { modelo: "Tech Wise Phone 5", precio: 799, imagen: "TechWisePhone5.png" },
      { modelo: "Tech Wise Phone 5 Ultra", precio: 999, imagen: "TechWisePhone5Ultra.png" },
      { modelo: "Tech Wise Phone SE", precio: 199, imagen: "TechWisePhoneSE.png" },
      { modelo: "Tech Wise Phone Fold", precio: 1299, imagen: "TechWisePhoneFold.png" }
    ];

    const techwiseGuardados = moviles.filter(m => m.marca === "techwise");
    const techwiseTodos = [...techwiseGuardados, ...techwiseDefault];

    function mostrar() {
      const container = document.getElementById("techwiseGrid");
      container.innerHTML = techwiseTodos.map(m => `
        <div class="card">
          <img src="${m.imagen}" alt="${m.modelo}">
          <h3>${m.modelo}</h3>
          <div class="price">${m.precio} €</div>
          <div class="buttons">
            <button class="btn btn-primary" onclick="add('${m.modelo}', ${m.precio})">Añadir</button>
            <button class="btn btn-secondary" onclick="comparar('${m.modelo}', '${m.imagen}')">Comparar</button>
          </div>
        </div>
      `).join("");
      
      document.getElementById("contador").textContent = (JSON.parse(localStorage.getItem("carrito")) || []).length;
    }

    function add(nombre, precio) {
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.push({ nombre, precio });
      localStorage.setItem("carrito", JSON.stringify(carrito));
      document.getElementById("contador").textContent = carrito.length;
      alert("Añadido: " + nombre);
    }

    function comparar(nombre, imagen) {
      const comp = JSON.parse(localStorage.getItem("comparar")) || [];
      if (comp.length >= 3) { alert("Máximo 3 móviles para comparar"); return; }
      if (!comp.find(x => x.nombre === nombre)) {
        comp.push({ nombre, imagen });
        localStorage.setItem("comparar", JSON.stringify(comp));
        alert("Añadido a comparar: " + nombre);
      } else {
        alert("Ya está en la comparación");
      }
    }

    mostrar();
  </script>
</body>

</html>
