<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Tech Wise</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-form {
      max-width: 600px;
      margin: 0 auto;
      background: var(--white);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-group input[type="file"] {
      padding: 5px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="logo">
      <img src="logo-techwise.png" alt="Logo Tech Wise">
      <span>Admin - Tech Wise</span>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="carro.html">Carro</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>

  <div class="content">
    <h1 class="page-title">Añadir Nuevo Móvil</h1>
    
    <div class="admin-form">
      <div id="message" class="message"></div>
      
      <div class="form-group">
        <label for="marca">Marca:</label>
        <select id="marca" required>
          <option value="">Selecciona marca</option>
          <option value="iphone">iPhone</option>
          <option value="samsung">Samsung</option>
          <option value="xiaomi">Xiaomi</option>
          <option value="huawei">Huawei</option>
          <option value="google">Google Pixel</option>
          <option value="motorola">Motorola</option>
          <option value="oppo">Oppo</option>
          <option value="techwise">Tech Wise</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" placeholder="ej: iPhone 16 Pro Max" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="precio">Precio (€):</label>
          <input type="number" id="precio" placeholder="1499" required>
        </div>
        <div class="form-group">
          <label for="imagen">Imagen:</label>
          <input type="file" id="imagen" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label for="imagenUrl">O URL de imagen:</label>
        <input type="url" id="imagenUrl" placeholder="https://ejemplo.com/imagen.png">
      </div>

      <button class="btn btn-primary" style="width:100%" onclick="guardarMovil()">Guardar Móvil</button>
    </div>

    <h2 class="page-title" style="margin-top:40px">Últimos móviles añadidos</h2>
    <div class="grid" id="movilesRecientes"></div>
    
    <h2 class="page-title" style="margin-top:40px">Buscar nuevos móviles</h2>
    <div class="admin-form">
      <div class="form-group">
        <label for="buscar">Buscar móvil:</label>
        <input type="text" id="buscar" placeholder="ej: iPhone 16">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="buscarMovil()">Buscar en Google</button>
      <div id="resultados" class="grid" style="margin-top:20px"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div>Tech Wise - Admin</div>
    <div class="center-address">Calle Corcega 31, Barcelona</div>
    <div>Tel: 634 578 952</div>
  </div>

  <script>
    const moviles = JSON.parse(localStorage.getItem("moviles")) || [];

    function guardarMovil() {
      const marca = document.getElementById("marca").value;
      const modelo = document.getElementById("modelo").value;
      const precio = parseFloat(document.getElementById("precio").value);
      const imagenUrl = document.getElementById("imagenUrl").value;
      const imagenFile = document.getElementById("imagen").files[0];

      if (!marca || !modelo || !precio) {
        mostrarMensaje("Por favor completa todos los campos", "error");
        return;
      }

      let imagen = imagenUrl;
      if (imagenFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          guardarDatos(marca, modelo, precio, e.target.result);
        };
        reader.readAsDataURL(imagenFile);
      } else {
        guardarDatos(marca, modelo, precio, imagen);
      }
    }

    function guardarDatos(marca, modelo, precio, imagen) {
      const movil = { marca, modelo, precio, imagen };
      moviles.push(movil);
      localStorage.setItem("moviles", JSON.stringify(moviles));
      mostrarMensaje("Móvil guardado correctamente", "success");
      mostrarRecientes();
      limpiarForm();
    }

    function mostrarMensaje(texto, tipo) {
      const msg = document.getElementById("message");
      msg.textContent = texto;
      msg.className = "message " + tipo;
    }

    function limpiarForm() {
      document.getElementById("modelo").value = "";
      document.getElementById("precio").value = "";
      document.getElementById("imagenUrl").value = "";
      document.getElementById("imagen").value = "";
    }

    function mostrarRecientes() {
      const container = document.getElementById("movilesRecientes");
      const recientes = moviles.slice(-8).reverse();
      container.innerHTML = recientes.map(m => `
        <div class="card">
          <img src="${m.imagen || 'descarga.png'}" alt="${m.modelo}">
          <h3>${m.modelo}</h3>
          <div class="price">${m.precio} €</div>
          <span style="color:var(--primary)">${m.marca}</span>
        </div>
      `).join("") || "<p style=text-align:center;grid-column:span 3>No hay móviles añadidos</p>";
    }

    function buscarMovil() {
      const busqueda = document.getElementById("buscar").value;
      if (!busqueda) return;
      
      window.open(`https://www.google.com/search?q=${encodeURIComponent(busqueda + " price buy")}`, '_blank');
    }

    mostrarRecientes();
  </script>
</body>

</html>
